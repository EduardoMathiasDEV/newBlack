<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Nome do produto</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/checkout.js" defer></script>
</head>
<body>
  <header class="shell top"><a class="brand" href="index.html"><span aria-hidden="true">◈</span> Nome do produto</a><a class="nav-link" href="index.html">Voltar ao produto</a></header>
  <main class="shell checkout">
    <section class="checkout-card" aria-labelledby="titulo">
      <p class="eyebrow">Checkout</p>
      <h1 id="titulo">Resumo do pedido</h1>
      <div class="order-row"><span>Nome do produto</span><strong>US$ 49,00</strong></div>
      <div class="order-row total"><span>Total</span><strong>US$ 49,00</strong></div>
      <p>Você será redirecionado para concluir o pagamento no gateway.</p>
      <button class="button" id="pay" type="button">Continuar para pagamento</button>
      <p class="notice" id="payment-status" role="status" hidden></p>
      <noscript>Ative o JavaScript para continuar com o pagamento.</noscript>
    </section>
  </main>
</body>
</html>
